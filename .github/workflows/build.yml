name: Build

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]
  pull_request:
    paths-ignore: ["**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Regression tests
        run: bash Tests/run.sh
      - name: Native accent and contrast checks
        run: bash Tests/accent.sh
      - name: Build universal app
        run: ./build.sh --universal
      - name: Native automatic connector and settings tests
        timeout-minutes: 2
        run: ./TokensBar.app/Contents/MacOS/TokensBar --automatic-checks
      - name: Verify bundle
        run: bash Tools/verify-release.sh
      - name: Render native candidate views
        run: bash Tools/render-readme-snapshots.sh "$PWD/TokensBar.app" candidate-snapshots
      - name: Render native Agent usage candidate
        run: |
          mkdir -p candidate-snapshots/agents
          for lang in en zh; do
            ./TokensBar.app/Contents/MacOS/TokensBar --agent-diagnostics candidate-snapshots/agents --lang "$lang"
            ./TokensBar.app/Contents/MacOS/TokensBar --agent-diagnostics candidate-snapshots/agents dark catalog --lang "$lang"
            ./TokensBar.app/Contents/MacOS/TokensBar --agent-diagnostics candidate-snapshots/agents automatic --lang "$lang"
            ./TokensBar.app/Contents/MacOS/TokensBar --agent-diagnostics candidate-snapshots/agents automatic dark --lang "$lang"
            ./TokensBar.app/Contents/MacOS/TokensBar --preferences-diagnostics candidate-snapshots/preferences --lang "$lang"
            ./TokensBar.app/Contents/MacOS/TokensBar --preferences-diagnostics candidate-snapshots/preferences dark --lang "$lang"
          done
          sips -g pixelWidth -g pixelHeight candidate-snapshots/agents/*.png
      - name: Package
        run: |
          ditto -c -k --keepParent TokensBar.app TokensBar.app.zip
          shasum -a 256 TokensBar.app.zip > SHA256SUMS.txt
      # actions/upload-artifact v4.6.2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: TokensBar-macos-universal
          path: |
            TokensBar.app.zip
            SHA256SUMS.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: TokensBar-candidate-snapshots
          path: candidate-snapshots
          if-no-files-found: error
