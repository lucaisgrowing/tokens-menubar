name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish (never overwrites a release)
        required: true

permissions:
  contents: write

concurrency:
  group: tokensbar-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate tag
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Confirm release does not exist
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > /tmp/releases.json
          jq -e --arg tag "$RELEASE_TAG" 'all(.[]; .tag_name != $tag)' /tmp/releases.json
      - name: Regression tests
        run: bash Tests/run.sh
      - name: Build universal app
        run: ./build.sh --universal
      - name: Verify bundle and tag version
        run: bash Tools/verify-release.sh
      - name: Package
        run: |
          ditto -c -k --keepParent TokensBar.app TokensBar.app.zip
          shasum -a 256 TokensBar.app.zip > SHA256SUMS.txt
          cp .github/release-notes.md notes.md
          printf '\n## SHA-256\n\n```text\n' >> notes.md
          cat SHA256SUMS.txt >> notes.md
          printf '```\n' >> notes.md
      - name: Create complete draft release
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft \
            --title "TokensBar $RELEASE_TAG" --notes-file notes.md \
            TokensBar.app.zip SHA256SUMS.txt
      - name: Publish verified release
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
